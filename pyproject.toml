[project]
name = "handa"
version = "0.1.0"
description = "Handa is a multi-agent catering operations desk. It turns an event brief into a menu, a purchase list, a budget check, a crew plan, and a quotation a manager has to approve."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Charlene Cordero" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "langgraph>=0.2.60",
  "chromadb>=0.5.23,<0.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
handa = "handa.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handa = ["static/*", "sample_data/*", "sample_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore:Accessing the 'model_fields' attribute:pydantic.warnings.PydanticDeprecatedSince211",
]
